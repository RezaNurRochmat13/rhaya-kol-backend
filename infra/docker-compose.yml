services:
  postgres:
    image: postgres:15
    container_name: kol-postgres-dev
    environment:
      POSTGRES_USER: kol
      POSTGRES_PASSWORD: kol
      POSTGRES_DB: kol-db
    ports:
      - "5439:5432"
    volumes:
      - kol_dev_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:15
    container_name: kol-postgres-test
    environment:
      POSTGRES_USER: kol
      POSTGRES_PASSWORD: kol
      POSTGRES_DB: kol-test-db
    ports:
      - "5433:5432"
    volumes:
      - kol_test_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    container_name: kol-redis-dev
    ports:
      - "6379:6379"

volumes:
  kol_dev_data:
  kol_test_data: